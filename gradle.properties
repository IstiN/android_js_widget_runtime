# Maven Central rate-limits shared runner egress IPs (HTTP 429): three default
# attempts 1 s apart all land inside the same window. More attempts, wider backoff
# (runs 45921724145 shard 8, 45921719226 shard 7 — each lost one random shard).
systemProp.org.gradle.internal.repository.max.tentatives=5
systemProp.org.gradle.internal.repository.initial.backoff=5000
