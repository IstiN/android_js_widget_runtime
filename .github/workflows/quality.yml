name: Quality

on: [push, pull_request]

# A new push cancels the runs of the previous head of the same branch/PR:
# superseded runs must not hold the runner queue (segment A3b).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # План 521: NDK и CMake тех же версий, что и локально (env.sh).
      - name: Install NDK and CMake
        run: |
          sdkmanager_dir="$ANDROID_HOME/cmdline-tools/latest/bin"
          [ -x "$sdkmanager_dir/sdkmanager" ] || sdkmanager_dir="$ANDROID_HOME/tools/bin"
          yes | "$sdkmanager_dir/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Fetch conformance pins
        run: bash scripts/fetch-conformance.sh

      - name: Bootstrap drift check
        run: |
          bash scripts/sync-bootstrap.sh
          git diff --exit-code

      - name: Unit tests with coverage
        run: ./gradlew testDebugUnitTest createDebugUnitTestCoverageReport

      - name: Build crap4kotlin from the pin
        run: ./gradlew -p .conformance/crap4kotlin installDist

      # План 152: отсутствие или пустота файла покрытия валит job.
      - name: CRAP gate (threshold 8.0)
        run: |
          coverage=app/build/reports/coverage/test/debug/report.xml
          test -s "$coverage" || { echo "coverage file missing or empty: $coverage"; exit 1; }
          .conformance/crap4kotlin/build/install/crap4kotlin/bin/crap4kotlin \
            app/src/main/java --coverage "$coverage" --threshold 8.0

      - name: Upload test and coverage reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/coverage/test/debug/report.xml
          if-no-files-found: ignore

  # План 6.1 A2: раннер фикстур на эмуляторе; обвязка ставит PASS по seed.
  # A3 расширит до всех L0 фикстур (без аргумента filter).
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install NDK and CMake
        run: |
          sdkmanager_dir="$ANDROID_HOME/cmdline-tools/latest/bin"
          [ -x "$sdkmanager_dir/sdkmanager" ] || sdkmanager_dir="$ANDROID_HOME/tools/bin"
          yes | "$sdkmanager_dir/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Fetch conformance pins
        run: bash scripts/fetch-conformance.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Версия экшена не проверена локально (план 556). История: api 24 глох
      # на GH Actions только из-за отсутствия TCG-флага (первый запуск был
      # без ANDROID_I_WANT_MY_TCG; та же причина, что и "Software CPU
      # emulation is not supported"); api 30 под TCG грузится, но
      # system_server умирает под нагрузкой. Итог: api 24 (minSdk) + TCG.
      # TCG-эмулятор хрупок по памяти: собираем APK до загрузки эмулятора
      # и гасим Gradle-демон, чтобы сборка не шла параллельно с живым эмулятором.
      - name: Build APKs before boot
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest
          ./gradlew --stop

      - name: Run fixtures on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          # TCG-эмулятор падает в adb-шаге отключения анимаций (broken pipe);
          # драйвер шлёт MotionEvent напрямую, анимации не нужны.
          disable-animations: false
          script: |
            # Direct adb install of the APKs built BEFORE boot: a gradle
            # invocation inside the emulator step starts a new daemon and
            # competes with the TCG emulator for CPU (measured: run
            # 45710683703, boot variance 6-60 min under load).
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Run the instrumentation DIRECTLY (no gradle connected task: it
            # uninstalls the app afterwards and deletes every app-private
            # result location). The runner writes result.json to the internal
            # files dir; collect it as root while the app is still installed.
            # One line per command: the action runs the script line by line.
            # timeout 600 + -e timeout 120000: a hung fixture (run 45710683703,
            # shards 0/2 hung >60 min in this step) fails fast with the
            # instrument tail instead of burning the job budget.
            timeout 600 adb shell am instrument -w -e timeout 120000 -e fixtureFilter hello,counter,scroll_list com.test.jsr.test/androidx.test.runner.AndroidJUnitRunner > instrument.log 2>&1; tail -20 instrument.log
            grep -q "OK (" instrument.log || { tail -40 instrument.log; exit 1; }
            adb shell su 0 ls -la /data/user/0/com.test.jsr/files/conformance || true
            mkdir -p app/build/reports/conformance
            for f in $(adb shell su 0 ls /data/user/0/com.test.jsr/files/conformance | tr -d '\r'); do adb exec-out su 0 cat "/data/user/0/com.test.jsr/files/conformance/$f" > "app/build/reports/conformance/$f"; done
            ls app/build/reports/conformance/ || true
            # Evidence artifact: driver/renderer/recorder logcat of the run.
            adb logcat -d > logcat.txt 2>&1 || true
            tail -3 logcat.txt

      - name: Collect results
        run: |
          # The adb collection above already placed the files; a gradle task
          # writing into build/reports would trigger Gradle stale-output
          # cleanup and delete them.
          count=$(ls app/build/reports/conformance/*.result.json 2>/dev/null | wc -l)
          echo "result.json files: $count"
          test "$count" -ge 3 || { echo "expected >= 3 result.json (vacuous pass guard)"; exit 1; }

      - name: Harness compare
        run: |
          node .conformance/js_widget_runtime/harness/harness.mjs compare \
            --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures \
            --results app/build/reports/conformance \
            --out-report conformance-android.md \
            --out-badge badges/conformance-android.json
          cat conformance-android.md

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-android
          path: |
            conformance-android.md
            logcat.txt
            app/build/reports/conformance/
          if-no-files-found: warn

  # План 6.1 A3: L0-набор фикстур (одна на каждый зарегистрированный тип).
  # Матрица из 6 шард (A3b: было 4 — шард 0/2 упирались в бюджет ~30 мин из-за
  # вариации загрузки TCG-эмулятора, run 45710683703). TCG без KVM, ~4.6 c на
  # фикстуру в инструментальных тестах + загрузка эмулятора 6-60 мин.
  # 6 шард по ~14 фикстур: типичный job ~11 мин, хвост < 30 мин.
  conformance-l0:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install NDK and CMake
        run: |
          sdkmanager_dir="$ANDROID_HOME/cmdline-tools/latest/bin"
          [ -x "$sdkmanager_dir/sdkmanager" ] || sdkmanager_dir="$ANDROID_HOME/tools/bin"
          yes | "$sdkmanager_dir/sdkmanager" "ndk;27.2.12479018" "cmake;3.22.1" > /dev/null

      - name: Fetch conformance pins
        run: bash scripts/fetch-conformance.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fixture list for this shard
        id: list
        run: |
          all=$(ls .conformance/js_widget_runtime/docs/conformance/fixtures | grep '^l0_' | sort)
          echo "total=$(echo "$all" | wc -l)"
          filter=$(echo "$all" | awk -v s=${{ matrix.shard }} -v t=6 'NR % t == s' | paste -sd,)
          count=$(echo "$filter" | tr ',' '\n' | wc -l)
          echo "fixtures=$count"
          echo "filter=$filter" >> "$GITHUB_OUTPUT"
          test -n "$filter" || { echo "empty shard"; exit 1; }

      - name: Build APKs before boot
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest
          ./gradlew --stop

      - name: Run L0 fixtures on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_I_WANT_MY_TCG: 'yes'
        with:
          api-level: 24
          target: google_apis
          arch: x86_64
          disable-animations: false
          script: |
            # Direct adb install of the APKs built BEFORE boot (no gradle
            # daemon restart inside the TCG emulator; same as the seeds job).
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Same as the seeds job: direct am instrument (gradle's connected
            # task uninstalls the app and wipes the results), collect the
            # internal files as root; one line per command.
            # timeout 600 + -e timeout 120000: a hung fixture fails fast with
            # the instrument tail (run 45710683703 shards 0/2 hung >60 min).
            timeout 600 adb shell am instrument -w -e timeout 120000 -e fixtureFilter ${{ steps.list.outputs.filter }} com.test.jsr.test/androidx.test.runner.AndroidJUnitRunner > instrument.log 2>&1; tail -20 instrument.log
            grep -q "OK (" instrument.log || { tail -40 instrument.log; exit 1; }
            adb shell su 0 ls -la /data/user/0/com.test.jsr/files/conformance || true
            mkdir -p app/build/reports/conformance
            for f in $(adb shell su 0 ls /data/user/0/com.test.jsr/files/conformance | tr -d '\r'); do adb exec-out su 0 cat "/data/user/0/com.test.jsr/files/conformance/$f" > "app/build/reports/conformance/$f"; done
            ls app/build/reports/conformance/ || true
            # Evidence artifact: driver/renderer/recorder logcat of the run.
            adb logcat -d > logcat.txt 2>&1 || true
            tail -3 logcat.txt

      - name: Collect results
        run: |
          # The adb collection above already placed the files; a gradle task
          # writing into build/reports would trigger Gradle stale-output
          # cleanup and delete them.
          expected=$(echo "${{ steps.list.outputs.filter }}" | tr ',' '\n' | wc -l)
          count=$(ls app/build/reports/conformance/*.result.json 2>/dev/null | wc -l)
          echo "result.json files: $count (expected $expected)"
          test "$count" -ge "$expected" || { echo "shard produced fewer results than requested (vacuous pass guard)"; exit 1; }

      - name: Harness compare (shard)
        run: |
          node .conformance/js_widget_runtime/harness/harness.mjs compare \
            --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures \
            --results app/build/reports/conformance \
            --out-report conformance-android-l0.md \
            --out-badge badges/conformance-android-l0.json
          cat conformance-android-l0.md

      - name: Upload conformance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-android-l0-shard${{ matrix.shard }}
          path: |
            conformance-android-l0.md
            logcat.txt
            app/build/reports/conformance/
          if-no-files-found: warn

  # Одна сводная таблица по всем шардам L0 (еvidence для отчёта и wave D).
  l0-report:
    runs-on: ubuntu-latest
    needs: conformance-l0
    steps:
      - uses: actions/checkout@v4

      - name: Fetch conformance pins
        run: bash scripts/fetch-conformance.sh

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Merge shard results
        uses: actions/download-artifact@v4
        with:
          pattern: conformance-android-l0-shard*
          merge-multiple: true
          path: results/

      - name: Harness compare (all L0)
        run: |
          count=$(ls results/**/*.result.json results/*.result.json 2>/dev/null | wc -l)
          echo "merged result.json files: $count"
          mkdir -p results-flat
          find results -name '*.result.json' -exec cp {} results-flat/ \;
          node .conformance/js_widget_runtime/harness/harness.mjs compare \
            --fixtures .conformance/js_widget_runtime/docs/conformance/fixtures \
            --results results-flat \
            --out-report conformance-android-l0.md \
            --out-badge badges/conformance-android-l0.json
          cat conformance-android-l0.md

      - name: Upload merged L0 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-android-l0
          path: |
            conformance-android-l0.md
            badges/conformance-android-l0.json
            results-flat/
          if-no-files-found: warn
